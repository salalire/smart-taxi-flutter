name: smart_taxi
description: Ethiopian Minibus Monitoring — unified role-based app for Driver, Passenger, Inspector and Ministry Admin.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ──────────────────────────────────────────────
  go_router: ^14.2.7

  # ── State management ────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── HTTP + networking ────────────────────────────────────────
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # ── Secure token storage ─────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Maps (OpenStreetMap, no API key needed) ───────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ── GPS ──────────────────────────────────────────────────────
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # ── Local notifications (Inspector dispatch alerts) ───────────
  flutter_local_notifications: ^17.2.3

  # ── Utilities ────────────────────────────────────────────────
  intl: ^0.20.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
